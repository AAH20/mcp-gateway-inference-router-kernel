[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-gateway-inference-router-kernel"
version = "0.1.0"
description = "Algorithmic Solvers for MCP Gateway Bottlenecks, Radix Prefix-Cache Routing, Model Cascades, and Multi-Agent Orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Autonomous Intelligence Routing Group", email = "kernel@mcp-gateway.internal"}
]
keywords = [
    "mcp",
    "mcp-gateway",
    "inference-router",
    "prefix-caching",
    "radix-tree",
    "model-cascading",
    "knapsack-pruning",
    "submodular",
    "rate-limiting",
    "agentic-ai",
    "np-hard"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing"
]

[project.scripts]
mcp-router = "mcp_gateway_inference_router_kernel.cli:main"
